<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html

    # Let PHP see the Authorization header (admin login token).
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The PHP backend is outside the web root; it is only reachable through the rewrites below.
    <Directory /var/www/backend>
        Require all granted
    </Directory>

    RewriteEngine On

    # API calls and database-stored uploads go to the PHP front controller.
    RewriteRule ^/(api|media)/ /var/www/backend/index.php [L]

    # Anything that is not a real file is the React app (client-side routing, /admin/...).
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    # Caching: hashed build files never change; the page itself must always be fresh.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/images/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
